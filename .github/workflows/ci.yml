name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      billed:
        description: Also run tests that order a billed VM
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PULUMI_SKIP_UPDATE_CHECK: "1"
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: |
            provider/go.sum
            sdk/go.sum
            examples/go.sum
      - uses: pulumi/actions@v6
        with:
          pulumi-version-file: .pulumi-version
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g yarn@1.22.22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Regenerate the schema and SDKs
        run: |
          make schema
          make generate_sdks
      - name: Committed schema and SDKs are up to date
        run: |
          git status --porcelain
          git diff --exit-code -- provider/cmd sdk || {
            echo "::error::Run 'make tfgen' and 'make generate_sdks' and commit the result."
            exit 1
          }

      - run: make provider
      - run: make test_provider
      - run: make lint
      - run: make build_sdks

      - uses: actions/upload-artifact@v4
        with:
          name: build
          retention-days: 3
          path: |
            bin/pulumi-resource-noderings
            sdk/nodejs/bin
            sdk/python/bin

  integration:
    name: Integration tests (live API)
    needs: build
    # Only on this repository, where the secret exists; forks skip it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODERINGS_TOKEN: ${{ secrets.NODERINGS_TOKEN }}
      NODERINGS_TEST_BILLED: ${{ inputs.billed && '1' || '' }}
      PULUMI_CONFIG_PASSPHRASE: ci
      PULUMI_BACKEND_URL: file://${{ github.workspace }}/.pulumi-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: |
            provider/go.sum
            examples/go.sum
      - uses: pulumi/actions@v6
        with:
          pulumi-version-file: .pulumi-version
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g yarn@1.22.22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - uses: actions/download-artifact@v4
        with:
          name: build
      - name: Prepare
        run: |
          chmod +x bin/pulumi-resource-noderings
          mkdir -p .pulumi-state
          ssh-keygen -q -t ed25519 -N "" -f "$HOME/.ssh/id_ed25519"
          cd sdk/nodejs/bin && yarn link
      - name: Run the examples
        if: env.NODERINGS_TOKEN != ''
        run: cd examples && go test -v -count=1 -tags=all -timeout 80m -parallel 4 ./...
