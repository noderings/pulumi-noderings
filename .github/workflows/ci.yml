name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      billed:
        description: Also run tests that order a billed VM
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pulumi downloads plugins (such as the terraform converter tfgen uses for
  # examples) from the GitHub API; unauthenticated calls hit the rate limit.
  GITHUB_TOKEN: ${{ github.token }}
  PULUMI_SKIP_UPDATE_CHECK: "1"
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

jobs:
  build:
    name: Build and unit test
    # Pushes to main run on the org runner; pull requests and everything else stay GitHub-hosted.
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: |
            provider/go.sum
            sdk/go.sum
            examples/go.sum
      - uses: pulumi/actions@v6
        with:
          pulumi-version-file: .pulumi-version
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g yarn@1.22.22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Regenerate the schema and SDKs
        run: |
          make schema
          make generate_sdks
      - name: Committed schema and SDKs are up to date
        run: |
          git status --porcelain
          git diff --exit-code -- provider/cmd sdk || {
            echo "::error::Run 'make tfgen' and 'make generate_sdks' and commit the result."
            exit 1
          }

      - run: make provider
      - run: make test_provider
      - run: make lint
      - run: make build_sdks

      - uses: actions/upload-artifact@v7
        with:
          name: build
          retention-days: 3
          path: |
            bin/pulumi-resource-noderings
            sdk/nodejs/bin
            sdk/python/bin

  release-config:
    name: Release config and docs
    # Pushes to main run on the org runner; pull requests and everything else stay GitHub-hosted.
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - name: Build the plugin archives (snapshot, nothing published)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Check the plugin archives
        run: |
          # Pulumi downloads pulumi-resource-noderings-v<version>-<os>-<arch>.tar.gz
          for p in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            ls dist/pulumi-resource-noderings-v*-"${p}".tar.gz
          done
      - name: Check the Pulumi Registry docs
        run: |
          # The Registry needs YAML front matter with title, meta_desc and layout: package.
          for f in docs/_index.md docs/installation-configuration.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "::error file=$f::missing front matter"; exit 1; }
            for k in title meta_desc layout; do
              sed -n '2,/^---$/p' "$f" | grep -q "^${k}: " || { echo "::error file=$f::front matter lacks ${k}"; exit 1; }
            done
          done
          grep -q '"displayName": "NodeRings"' provider/cmd/pulumi-resource-noderings/schema.json
          python3 -c "import json,sys; d=json.load(open('provider/cmd/pulumi-resource-noderings/schema.json')); sys.exit('schema.json must not set version' if 'version' in d else 0)"
          python3 -c "import json; json.load(open('release-please-config.json')); json.load(open('.release-please-manifest.json'))"

  integration:
    name: Integration tests (live API)
    needs: build
    # Only on this repository, where the secret exists; forks skip it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Pushes to main run on the org runner; pull requests and everything else stay GitHub-hosted.
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      NODERINGS_TOKEN: ${{ secrets.NODERINGS_TOKEN }}
      NODERINGS_TEST_BILLED: ${{ inputs.billed && '1' || '' }}
      PULUMI_CONFIG_PASSPHRASE: ci
      PULUMI_BACKEND_URL: file://${{ github.workspace }}/.pulumi-state
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: |
            provider/go.sum
            examples/go.sum
      - uses: pulumi/actions@v6
        with:
          pulumi-version-file: .pulumi-version
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g yarn@1.22.22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - uses: actions/download-artifact@v8
        with:
          name: build
      - name: Prepare
        run: |
          chmod +x bin/pulumi-resource-noderings
          mkdir -p .pulumi-state
          ssh-keygen -q -t ed25519 -N "" -f "$HOME/.ssh/id_ed25519"
          cd sdk/nodejs/bin && yarn link
      - name: Run the examples
        if: env.NODERINGS_TOKEN != ''
        run: cd examples && go test -v -count=1 -tags=all -timeout 80m -parallel 4 ./...
