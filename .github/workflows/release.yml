name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  PULUMI_SKIP_UPDATE_CHECK: "1"

jobs:
  plugin:
    name: Provider plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-sdk:
    name: Go SDK tag
    needs: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag sdk/${{ github.ref_name }}
        run: |
          git tag "sdk/${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          git push origin "sdk/${GITHUB_REF_NAME}"
