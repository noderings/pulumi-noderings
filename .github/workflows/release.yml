# Release workflow: builds the provider plugin, tags the Go SDK, and publishes
# the SDKs to npm, PyPI and NuGet.
#
# Normally release-please pushes the vX.Y.Z tag, together with a draft GitHub
# release holding the changelog, when its release pull request is merged.
# GoReleaser uploads the plugin archives and schema.json to that draft and
# publishes it; the SDKs are published after that, so the plugin they point to
# is already downloadable. The Pulumi Registry picks the published release up
# on its twice-daily check.
#
# Each registry publishes only when it has been set up (see CONTRIBUTING.md,
# "Releasing"); otherwise its job ends with a warning and the rest still run.
#
# workflow_dispatch rebuilds and republishes an existing tag: pick the tag in
# the "Use workflow from" menu (the publish environments only accept v* tags).
# Versions that already exist on a registry are skipped.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PULUMI_SKIP_UPDATE_CHECK: "1"
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  TAG: ${{ github.ref_name }}

jobs:
  plugin:
    name: Provider plugin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check the tag
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run this workflow from a vX.Y.Z tag (got ${GITHUB_REF_TYPE} ${TAG})."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Find the checksums file
        id: sums
        run: echo "path=$(ls dist/*_checksums.txt)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ steps.sums.outputs.path }}

  go-sdk:
    name: Go SDK tag
    needs: plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Tag sdk/${{ env.TAG }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/sdk/${TAG}" >/dev/null; then
            echo "sdk/${TAG} already exists."
            exit 0
          fi
          git tag "sdk/${TAG}" "$(git rev-parse HEAD)"
          git push origin "sdk/${TAG}"

  sdks:
    name: Build SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pulumi/actions@v6
        with:
          pulumi-version-file: .pulumi-version
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g yarn@1.22.22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: |
          make VERSION="${TAG#v}" build_nodejs build_python build_dotnet
          cd sdk/dotnet && dotnet pack -c Release --no-build /p:Version="${TAG#v}" -o nupkg
      - name: Pack the npm package
        working-directory: sdk/nodejs/bin
        run: mkdir -p ../tarball && npm pack --pack-destination ../tarball
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            sdk/nodejs/tarball/*.tgz
            sdk/python/bin/dist/*
            sdk/dotnet/nupkg/*.nupkg
      - uses: actions/upload-artifact@v7
        with:
          name: sdks
          path: |
            sdk/nodejs/bin
            sdk/python/bin/dist
            sdk/dotnet/nupkg

  npm:
    name: npm
    needs: [plugin, sdks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the npm setup
        id: setup
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ "${HAS_TOKEN}" = "true" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          elif [ "${TRUSTED}" = "true" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=npm skipped::Set the variable NPM_TRUSTED_PUBLISHING=true (trusted publisher) or the secret NPM_TOKEN (see CONTRIBUTING.md, Releasing)."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.setup.outputs.mode != 'skip'
        with:
          name: sdks
      - uses: actions/setup-node@v7
        if: steps.setup.outputs.mode != 'skip'
        with:
          # Trusted publishing needs Node 22.14+ and npm 11.5.1+.
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Publish
        if: steps.setup.outputs.mode != 'skip'
        working-directory: sdk/nodejs/bin
        env:
          MODE: ${{ steps.setup.outputs.mode }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@^11.6.0
          # With trusted publishing npm exchanges the GitHub OIDC token itself;
          # drop the token-based .npmrc that setup-node wrote.
          if [ "${MODE}" = "oidc" ]; then
            rm -f "${NPM_CONFIG_USERCONFIG}"
            unset NODE_AUTH_TOKEN
          fi
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm."
            exit 0
          fi
          npm publish --access public --provenance

  pypi:
    name: PyPI
    needs: [plugin, sdks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the PyPI setup
        id: setup
        env:
          TRUSTED: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
        run: |
          if [ "${TRUSTED}" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=PyPI skipped::Add the PyPI trusted publisher, then set the variable PYPI_TRUSTED_PUBLISHING=true (see CONTRIBUTING.md, Releasing)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.setup.outputs.ready == 'true'
        with:
          name: sdks
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.setup.outputs.ready == 'true'
        with:
          packages-dir: sdk/python/bin/dist/
          skip-existing: true

  nuget:
    name: NuGet
    needs: [plugin, sdks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the NuGet setup
        id: setup
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
          HAS_KEY: ${{ secrets.NUGET_API_KEY != '' }}
        run: |
          if [ -n "${NUGET_USER}" ]; then
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
          elif [ "${HAS_KEY}" = "true" ]; then
            echo "mode=key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=NuGet skipped::Add a NuGet trusted publishing policy and set the variable NUGET_USER, or set the secret NUGET_API_KEY (see CONTRIBUTING.md, Releasing)."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.setup.outputs.mode != 'skip'
        with:
          name: sdks
      - uses: actions/setup-dotnet@v6
        if: steps.setup.outputs.mode != 'skip'
        with:
          dotnet-version: "8.0.x"
      - uses: NuGet/login@v1
        if: steps.setup.outputs.mode == 'trusted'
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push
        if: steps.setup.outputs.mode != 'skip'
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: dotnet nuget push "sdk/dotnet/nupkg/*.nupkg" --api-key "${NUGET_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
